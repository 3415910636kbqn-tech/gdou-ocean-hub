name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../release-artifacts/gdou-schedule-android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdou-schedule-android-apk
          path: release-artifacts/gdou-schedule-android.apk

  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & sync iOS
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Build unsigned iOS .app & package .ipa
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          mkdir -p Payload ../../release-artifacts
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../release-artifacts/gdou-schedule-ios-unsigned.ipa Payload

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdou-schedule-ios-ipa
          path: release-artifacts/gdou-schedule-ios-unsigned.ipa
